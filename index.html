<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Circuits</title>
<script>
  (function() {
    const originalAddEventListener = window.addEventListener;
    window.addEventListener = function(type, listener, options) {
      if (type === 'unload') return;
      return originalAddEventListener.call(this, type, listener, options);
    };
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax@1.6.0/dist/fonts.min.css">
<script src="https://cdn.jsdelivr.net/npm/@rod2ik/tikzjax@1.6.0/dist/tikzjax.min.js" defer></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-layout">
  <div class="preview-pane">
    <div class="preview-body">
      <div id="output"></div>

      <!-- Floating Add Circuit Panels (Left) -->
      <div id="addPanelsContainer" class="add-panels-container" style="display: none;">
        <!-- Box 1: Add Components to Circuit -->
        <div id="addComponentsPanel" class="add-panel">
          <div class="add-panel-header">
            <span>Add Components to Circuit</span>
            <button class="modal-close modal-close-btn">&times;</button>
          </div>
          <div class="add-panel-body">
            <button id="modalChoiceAddNodeComponentBtn" class="form-btn">Block Component</button>
            <button id="modalChoiceAddPathNewNodeBtn" class="form-btn">Directional Component</button>
            <button id="modalChoiceAddPathBetweenNodesBtn" class="form-btn">Directional Component<br>(Start-End)</button>
            <button id="modalChoiceAddTextComponentBtn" class="form-btn">Text Component</button>
          </div>
        </div>

        <!-- Box 2: Add Nodes to Circuit -->
        <div id="addNodesPanel" class="add-panel">
          <div class="add-panel-header">
            <span>Add Nodes to Circuit</span>
            <button class="modal-close modal-close-btn">&times;</button>
          </div>
          <div class="add-panel-body">
            <button id="modalChoiceAddSimpleNodeBtn" class="form-btn">Directional Node</button>
            <button id="modalChoiceAddNodeBetweenBtn" class="form-btn">Line Segment Node</button>
            <button id="modalChoiceAddNodeCornerBtn" class="form-btn">Corner Intersection Node</button>
          </div>
        </div>
      </div>

      <!-- Detail Step Modal for Component / Node Configuration -->
      <div id="addPanel" class="add-panel" style="display: none;">
        <div class="add-panel-header">
          <span id="modalTitle">Add to Circuit</span>
          <button id="modalCloseBtn" class="modal-close">&times;</button>
        </div>

        <!-- Step 1: Device Selection -->
        <div id="modalStep1" class="add-panel-step" style="display: none;">
          <div class="form-group">
            <label class="form-label">Select Component</label>
            <select id="modalDeviceSelect" class="form-select">
              <option value="">-- Select Component --</option>
            </select>
          </div>
          <div id="modalPlacementNodeGroup" class="form-group" style="display: none;">
            <label id="modalCurrentNodeLabel" class="form-label">Placement Node</label>
            <div class="node-choice-row">
              <button id="modalPickCurrentNodeBtn" class="form-btn node-choice-btn" type="button">Pick Node</button>
            </div>
            <input type="text" id="modalCurrentNode" class="form-input node-target-input" readonly placeholder="No node selected" />
          </div>
          <div id="modalStep2Fields"></div>
          <div class="panel-actions">
            <button id="modalCompSelectBackBtn" class="form-btn btn-secondary">Back</button>
            <button id="modalAddBtn" class="form-btn">Add Component</button>
          </div>
        </div>

        <!-- Step 3: Add Node Configuration -->
        <div id="modalAddNodeStep" class="add-panel-step" style="display: none;">
          <div class="form-group">
            <label class="form-label">Start Node</label>
            <div class="node-choice-row">
              <button id="addNodePickStartBtn" class="form-btn node-choice-btn" type="button">Pick Node</button>
            </div>
            <input type="text" id="addNodeCurrentNode" class="form-input node-target-input" readonly placeholder="No node selected" />
          </div>
          <div id="addNodeRef2Group" class="form-group">
            <label class="form-label">End Node</label>
            <div class="node-choice-row">
              <button id="addNodePickBtn" class="form-btn node-choice-btn" type="button">Pick Node</button>
            </div>
            <input type="text" id="addNodeRef2Input" class="form-input node-target-input" readonly placeholder="No node selected" />
          </div>

          <div id="addNode1NodeFields">
            <div class="form-group">
              <label class="form-label">X Direction</label>
              <input type="number" step="0.5" id="addNodeXLength" class="form-input" value="2" />
            </div>
            <div class="form-group">
              <label class="form-label">Y Direction</label>
              <input type="number" step="0.5" id="addNodeYLength" class="form-input" value="-2" />
            </div>
          </div>

          <div id="addNode2NodesFields" style="display: none;">
            <!-- Between Fields -->
            <div id="addNodeBetweenFields">
              <div class="form-group">
                <label class="form-label">Segment Location (0-1 or %)</label>
                <input type="text" id="addNodeLocation" class="form-input" value="0.5" />
              </div>
            </div>

            <!-- Corner Fields -->
            <div id="addNodeCornerFields" style="display: none;">
              <div class="form-group">
                <label class="form-label">Corner Alignment</label>
                <select id="addNodeCornerTypeSelect" class="form-select">
                  <option value="-|">-|</option>
                  <option value="|-">|-</option>
                </select>
              </div>
            </div>
          </div>

          <div class="panel-actions">
            <button id="addNodeBackBtn" class="form-btn btn-secondary">Back</button>
            <button id="addNodeSubmitBtn" class="form-btn">Add Node</button>
          </div>
        </div>
      </div>

      <!-- Floating Edit Panel (Right) -->
      <div id="editPanel" class="edit-panel" style="display: none;">
        <div class="edit-panel-header">
          <span id="editPanelTitle">Edit Circuit</span>
          <button id="editPanelCloseBtn" class="modal-close">&times;</button>
        </div>
        <div id="editPanelBody" class="edit-panel-body"></div>
      </div>

      <div class="preview-toolbar" aria-label="Circuit actions">
        <div class="toolbar-group">
          <button id="addComponentBtn" class="toolbar-btn" type="button">Add Component</button>
          <button id="addNodeBtn" class="toolbar-btn" type="button">Add Node</button>
        </div>
        <div class="toolbar-group">
          <button id="copyTexBtn" class="toolbar-btn" type="button">Copy TeX</button>
          <button id="undoBtn" class="toolbar-btn" type="button" disabled>Undo</button>
          <button id="redoBtn" class="toolbar-btn" type="button" disabled>Redo</button>
          <button id="clearAllBtn" class="toolbar-btn" type="button">Clear All</button>
        </div>
        <div class="toolbar-group">
          <button id="toggleNodesBtn" class="toolbar-btn" type="button">Hide nodes</button>
          <button id="downloadBtn" class="toolbar-btn" type="button">Download SVG</button>
        </div>
      </div>
      <textarea id="latexInput" spellcheck="false"></textarea>
      <div id="nodeTooltip" role="tooltip"></div>
      <div id="secondNodeTooltip" role="tooltip"></div>
    </div>
  </div>
</div>

<div id="scratchpad"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
